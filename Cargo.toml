[package]
name = "oracle-court"
version = "0.1.0"
authors = ["Terra Oracle Classic"]
edition = "2021"
license = "Apache-2.0"
description = "Dispute court for Terra Oracle Classic prediction markets"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Сборка как библиотеки для интеграционных тестов: точки входа выключаются.
library = []

[dependencies]
# Версии выровнены с oracle-prophecy и oracle-pool: две разные минорные
# cosmwasm-std в одном дереве уже однажды ломали проверки типов.
cosmwasm-schema = "1.5.0"
cosmwasm-std = "1.5.0"
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
schemars = "0.8.16"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

# Интеграционные тесты против настоящего контракта рынков живут в
# отдельном крейте integration/. Здесь их нет намеренно: зависимость от
# соседнего репозитория ломала бы сборку в оптимизаторе, который видит
# только эту папку.

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
